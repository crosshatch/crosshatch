name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) ||
    github.ref }}

jobs:
  alchemize:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-crosshatch
      - uses: ./konfik/configure-environment
      - run: pnpm build
      - uses: alchemy-run/alchemy-effect@main
        with:
          working-directory: docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MADHATCHER_PAT }}
