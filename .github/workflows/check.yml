name: Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-crosshatch
      - uses: ./konfik/configure-environment
      - run: pnpm format --check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
        env:
          CDP_API_KEY_ID: ${{ vars.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          MNEMONIC: ${{ secrets.MNEMONIC }}
          PAY_TO_EIP155: ${{ vars.PAY_TO_EIP155 }}
